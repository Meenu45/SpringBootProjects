<!DOCTYPE html>
<html>
<head>
    <title>Spring Controller Output</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            text-align: center;
            background: white;
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 500px;
        }

        h1 {
            color: #6a11cb;
            margin-bottom: 20px;
        }

        p {
            color: #444;
            font-size: 18px;
        }

        .success {
            color: #28a745;
            font-weight: bold;
            font-size: 20px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        a:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌸 Spring Boot Application 🌸</h1>

    <p class="success">✓ Communication Successful!</p>

    <p>
        HTML page has successfully communicated
        with the Spring Controller.
    </p>

    <a href="/input.html">Back to Home</a>

</div>

</body>
</html>
