<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .login-box {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 15px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 30px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Login Page</h1>

    <form action="/login" method="post">

        <input type="text"
               name="username"
               placeholder="Enter Username"
               required>
        <br>
        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>
        <br>
        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
